# Локальный запуск витрины: docker compose up --build → http://localhost:8080 (demo@example.com / demo)
name: personal-crm

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_DB: crm
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "default_text_search_config=pg_catalog.russian", "-c", "max_connections=50"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm -t 2"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_USER: crm
      PG_DB: crm
      # секреты — файлами, а не переменными: переменные видны в docker inspect
      PG_PASSWORD_FILE: /run/secrets/pg_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      SEED_DEMO: ${SEED_DEMO:-1}
      DEMO_API_KEY: ${DEMO_API_KEY:-}
      API_DOCS: ${API_DOCS:-1}
    secrets: [pg_password, jwt_secret]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v2/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"

secrets:
  pg_password:
    file: ./secrets/pg_password
  jwt_secret:
    file: ./secrets/jwt_secret

volumes:
  pgdata:
